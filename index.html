<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update for Appe</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-pink: #ff8da1;
            --pixel-red: #e74c3c;
            --pixel-green: #2ecc71;
            --bg-color: #2c3e50;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            image-rendering: pixelated;
        }

        .container {
            text-align: center;
            background: #34495e;
            padding: 40px;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #000;
            max-width: 600px;
            width: 90%;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 { font-size: 12px; line-height: 1.8; margin-bottom: 20px; }
        p { font-size: 8px; line-height: 2; color: #bdc3c7; margin-bottom: 20px; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            padding: 12px;
            border: 4px solid #000;
            background: #ecf0f1;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s;
        }

        button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }
        
        #yesBtn { background: var(--pixel-green); color: white; }
        #noBtn { background: var(--pixel-red); color: white; }

        .hidden { display: none !important; }

        /* Map Styles */
        #map-container {
            position: relative;
            width: 100%;
            height: 200px;
            background: #1a252f;
            border: 4px solid #000;
            margin-top: 20px;
            overflow: hidden;
        }

        .city {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--pixel-green);
        }

        .city-label {
            position: absolute;
            font-size: 8px;
            margin-top: 12px;
        }

        .pixel-heart {
            position: absolute;
            font-size: 12px;
            color: var(--pixel-pink);
            z-index: 100;
            pointer-events: none;
        }

        #terminal-overlay {
            font-size: 8px;
            color: #2ecc71;
            text-align: left;
            margin-top: 15px;
            font-family: monospace;
            width: 100%;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container" id="game-box">
        <div id="intro">
            <p>> Loading 14+_Years_Memory_Log.zip...</p>
            <h1>Appe, <br> Mi kay mhntooo!!</h1>
            <button onclick="showStep('intro_1')">BOL</button>
        </div>

        <div id="intro_1" class="hidden">
            <h1>Shi jhali ka??</h1>
            <div class="btn-group">
                <button onclick="handleShiResponse(true)">Ho</button>
                <button onclick="handleShiResponse(false)">Nai, kaa?</button>    
            </div>    
        </div>

        <div id="branch_ho" class="hidden">
            <h1>Best, proud of you! <br> ani ata ek mahatvacha vicharu?</h1>
            <button onclick="showStep('quest')">Vichar!</button>
        </div>

        <div id="branch_nai" class="hidden">
            <h1>Sahaj, Quality check! <br> ek mahatvacha vicharu?</h1>
            <button onclick="showStep('quest')">Vichar!</button>
        </div>

        <div id="quest" class="hidden">
            <h1 id="question-text">Will you be my Valentine?</h1>
            <div id="terminal-overlay"></div>
            <div class="btn-group">
                <button id="yesBtn" onclick="celebrate()">YES</button>
                <button id="noBtn" onmouseover="interrogate()">NO</button>
            </div>
        </div>

        <div id="final" class="hidden">
            <h1>LOVE YOU MAX!</h1>
            <div id="map-container">
                <div class="city" style="left: 70%; top: 60%;"></div>
                <div class="city-label" style="left: 65%; top: 68%;">BLR</div>
                
                <div class="city" style="left: 20%; top: 20%;"></div>
                <div class="city-label" style="left: 12%; top: 28%;">ANTWERP</div>
            </div>
            <p style="margin-top:20px; color: white; font-size: 8px;">Infinite Pappis to you! <br> Happy Valentine's Day, foreignchi patlin ❤️</p>
        </div>
    </div>

    <script>
        let noCount = 0;
        const terminal = document.getElementById('terminal-overlay');
        const noBtn = document.getElementById('noBtn');

        const prompts = [
            "What? Nahi mhanuch kasa shaktes tu?",
            "Asa vichar tari kasa ala tujhya dokyat?",
            "You are stuck with me bitchwa, you have no option!",
            "Dhungan pe fatke dega mai!!",
            "Gapchup Yes bol, shahne!"
        ];

        function showStep(id) {
            // Hide all potential steps
            const steps = ['intro', 'intro_1', 'branch_ho', 'branch_nai', 'quest', 'final'];
            steps.forEach(step => {
                const el = document.getElementById(step);
                if (el) el.classList.add('hidden');
            });
            
            // Show the target step
            document.getElementById(id).classList.remove('hidden');
        }

        function handleShiResponse(isPositive) {
            if(isPositive) {
                showStep('branch_ho');
            } else {
                showStep('branch_nai');
            }
        }

        function interrogate() {
            if(noCount < prompts.length) {
                terminal.innerHTML += `> ${prompts[noCount]}<br>`;
                noCount++;
            }
            
            // Move button to random spot
            const padding = 50;
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - padding) + padding/2;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - padding) + padding/2;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            if(noCount === prompts.length) {
                noBtn.innerText = "YES";
                noBtn.style.background = "#2ecc71";
                noBtn.onmouseover = null; // Stop moving
                noBtn.onclick = celebrate; // Make it a second yes button
            }
        }

        function celebrate() {
            showStep('final');
            sendLove();
        }

        function sendLove() {
            const map = document.getElementById('map-container');
            // Sending 15 pixel hearts
            for(let i=0; i<15; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'pixel-heart';
                    heart.innerHTML = '❤';
                    heart.style.left = '70%'; // Starting at BLR
                    heart.style.top = '60%';
                    map.appendChild(heart);

                    // Animate to Antwerp coordinates
                    setTimeout(() => {
                        heart.style.transition = 'all 2s cubic-bezier(0.18, 0.89, 0.32, 1.28)';
                        heart.style.left = '20%';
                        heart.style.top = '20%';
                        
                        // Fade out after arrival
                        setTimeout(() => heart.style.opacity = '0', 1800);
                    }, 50);
                }, i * 300);
            }
        }
    </script>
</body>
</html>
