<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update for Appe</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            transition: opacity 0.8s ease;
        }

        h1 { font-weight: 300; font-size: 1.6rem; letter-spacing: -0.01em; line-height: 1.4; }
        
        .subtext {
            font-size: 0.75rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            display: block;
        }

        .btn-group {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }

        button {
            padding: 10px 30px;
            font-size: 0.85rem;
            border: 1px solid #eee;
            background: white;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s ease;
            color: #111;
        }

        #yesBtn:hover { border-color: #111; background: #111; color: white; }

        #noBtn { position: relative; z-index: 10; }

        .hidden { display: none; opacity: 0; }
    </style>
</head>
<body>

    <div id="step1" class="content">
        <span class="subtext">v10.0.0 — Production</span>
        <h1>We've been best friends for a decade. <br> I think it's time for an upgrade.</h1>
        <button onclick="nextStep(1, 2)">Next</button>
    </div>

    <div id="step2" class="content hidden">
        <span class="subtext">The Question</span>
        <h1>Will you be my Valentine, Appe?</h1>
        <div class="btn-group">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="handlePrank()">No</button>
        </div>
    </div>

    <div id="success" class="content hidden">
        <h1>I'll take that as a 'Yes'.</h1>
        <span class="subtext">Closing loop... Status: Success. ❤️</span>
    </div>

    <script>
        let attempts = 0;
        const noBtn = document.getElementById('noBtn');

        function nextStep(curr, next) {
            document.getElementById(`step${curr}`).style.opacity = '0';
            setTimeout(() => {
                document.getElementById(`step${curr}`).classList.add('hidden');
                const nextEl = document.getElementById(`step${next}`);
                nextEl.classList.remove('hidden');
                setTimeout(() => nextEl.style.opacity = '1', 50);
            }, 800);
        }

        function handlePrank() {
            attempts++;
            
            if (attempts < 3) {
                // Tactic 1: The Smooth Slide (Horizontal push)
                const offset = attempts * 150;
                noBtn.style.transform = `translateX(${offset}px)`;
            } 
            else if (attempts < 6) {
                // Tactic 2: The Ghost (Disappears when hovered)
                noBtn.style.opacity = "0";
                setTimeout(() => {
                    // Move it to a random spot while invisible
                    const x = Math.random() * (window.innerWidth - 100);
                    const y = Math.random() * (window.innerHeight - 50);
                    noBtn.style.position = 'fixed';
                    noBtn.style.left = x + 'px';
                    noBtn.style.top = y + 'px';
                    noBtn.style.transform = 'none';
                    noBtn.style.opacity = "1";
                }, 400);
            } 
            else {
                // Tactic 3: The Reality Bend (Becomes a Yes button)
                noBtn.innerText = "Yes";
                noBtn.style.background = "#111";
                noBtn.style.color = "white";
                noBtn.onclick = celebrate; // Now it actually works!
            }
        }

        function celebrate() {
            nextStep(2, 'success');
        }
    </script>
</body>
</html>
