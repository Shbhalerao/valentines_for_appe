<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message for Appe</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #fce4ec;
            --dark-pink: #d81b60;
            --soft-text: #5d4037;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fffafb;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 450px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.05);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: var(--dark-pink);
            margin-bottom: 15px;
        }

        p {
            font-size: 1.2rem;
            color: var(--soft-text);
            line-height: 1.5;
        }

        .btn-group {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            min-height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
        }

        #yesBtn {
            background-color: var(--dark-pink);
            color: white;
            z-index: 10;
        }

        #yesBtn:hover { transform: scale(1.1); }

        #noBtn {
            background-color: #eee;
            color: #888;
            position: relative;
        }

        .hidden { display: none; }

        /* Floating Hearts */
        .heart-emoji {
            position: fixed;
            top: -20px;
            font-size: 24px;
            animation: fall linear forwards;
            z-index: 999;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="step1" class="container">
        <h1>Hey Appe...</h1>
        <p>I have a very serious, non-negotiable question to ask you. Are you ready?</p>
        <button id="yesBtn" onclick="nextStep(1, 2)">I'm ready!</button>
    </div>

    <div id="step2" class="container hidden">
        <h1>Wait a sec!</h1>
        <p>Before we go further, you have to promise to be the happiest person in the world today.</p>
        <button id="yesBtn" onclick="nextStep(2, 3)">I promise! ❤️</button>
    </div>

    <div id="step3" class="container hidden">
        <h1>Will you be my Valentine, Appe?</h1>
        <div class="btn-group">
            <button id="yesBtn" onclick="celebrate()">YES</button>
            <button id="noBtn" id="noBtn">NO</button>
        </div>
    </div>

    <div id="success" class="container hidden">
        <h1>I knew it! ❤️</h1>
        <p>You're stuck with me, Appe. Happy Valentine's Day!</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        let escapeMode = 0;

        function nextStep(curr, next) {
            document.getElementById(`step${curr}`).classList.add('hidden');
            document.getElementById(`step${next}`).classList.remove('hidden');
        }

        noBtn.addEventListener('mouseover', () => {
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // Cycle through 3 types of evasive maneuvers
            if (escapeMode === 0) {
                // 1. The Random Teleport
                noBtn.style.position = 'fixed';
                noBtn.style.left = (Math.random() * maxX) + 'px';
                noBtn.style.top = (Math.random() * maxY) + 'px';
            } else if (escapeMode === 1) {
                // 2. The Tiny Target (Shrink)
                const currentScale = noBtn.style.transform || "scale(1)";
                let val = parseFloat(currentScale.replace('scale(', '')) || 1;
                noBtn.style.transform = `scale(${val * 0.7})`;
                noBtn.style.left = (Math.random() * maxX) + 'px';
                noBtn.style.top = (Math.random() * maxY) + 'px';
            } else {
                // 3. The Corner Dash
                noBtn.style.left = (Math.random() > 0.5 ? '10px' : maxX + 'px');
                noBtn.style.top = (Math.random() > 0.5 ? '10px' : maxY + 'px');
            }

            escapeMode = (escapeMode + 1) % 3;
        });

        function celebrate() {
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');
            
            // Heart Rain
            for(let i=0; i<60; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-emoji';
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    document.body.appendChild(heart);
                }, i * 80);
            }
        }
    </script>
</body>
</html>
